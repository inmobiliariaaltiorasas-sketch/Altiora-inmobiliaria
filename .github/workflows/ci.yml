name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/api

      - run: npm run build:shared

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck --workspace=apps/api
      - run: npm run typecheck --workspace=apps/web
      - run: npm test --workspace=apps/api
      - run: npm test --workspace=apps/web
      # The web build prerenders the sitemap, which reads the public API. Both values are public.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://altiora-api.onrender.com
          NEXT_PUBLIC_WEB_URL: https://altioraimobiliaria.online
