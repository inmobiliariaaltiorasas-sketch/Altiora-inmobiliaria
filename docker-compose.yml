services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-altiora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altiora}
      POSTGRES_DB: ${POSTGRES_DB:-altiora_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - altiora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altiora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  altiora_postgres_data:
